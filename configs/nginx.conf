server {
    listen $PORT;
    client_max_body_size 50m;
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
    }
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        proxy_pass $QT_SERVER/api/;
        proxy_set_header Referer '';
    }
}
