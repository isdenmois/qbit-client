server {
    listen $PORT;
    client_max_body_size 50m;
    root /usr/share/nginx/html;

    # Hashed build output never changes for a given name, so cache it forever.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Unhashed static files keep their names across builds, so cache them briefly.
    location ~* \.(?:png|svg|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # The shell must be revalidated on every launch. Without this, browsers apply
    # heuristic freshness and an installed app keeps serving the previous build.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location = /version.json {
        default_type application/json;
        add_header Cache-Control "no-cache";
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass $QT_SERVER/api/;
        proxy_set_header Referer '';
    }
}
